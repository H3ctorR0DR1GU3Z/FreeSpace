<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - FreeSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif; box-sizing:border-box; margin:0;}
body{background:#0a0a0a; color:white; height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
body::before{content:""; position:absolute; width:600px; height:600px; background:radial-gradient(circle, #0d6efd33 0%, transparent 70%); top:-100px; left:-100px; filter:blur(40px);}
body::after{content:""; position:absolute; width:500px; height:500px; background:radial-gradient(circle, #6f42c133 0%, transparent 70%); bottom:-100px; right:-100px; filter:blur(40px);}
.card{position:relative; z-index:2; background:#171717; border:1px solid #262626; width:380px; padding:32px; border-radius:22px; animation:fadeIn .6s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:translateY(0);}}
.logo{font-size:28px; font-weight:800; letter-spacing:-1px; margin-bottom:6px;}
.sub{color:#777; font-size:14px; margin-bottom:24px;}
label{font-size:13px; color:#aaa; display:block; margin:14px 0 6px;}
.input-wrap{position:relative;}
.input-wrap input{width:100%; background:#212121; border:1px solid #2a2a2a; color:white; padding:12px 42px 12px 14px; border-radius:10px; outline:none; transition:.2s; font-size:14px;}
input{width:100%; background:#212121; border:1px solid #2a2a2a; color:white; padding:12px 14px; border-radius:10px; outline:none; transition:.2s; font-size:14px;}
input:focus{border-color:#0d6efd; background:#252525;}
.eye{position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#777; transition:.2s; user-select:none; font-size:16px;}
.eye:hover{color:white;}
.btn{width:100%; background:white; color:black; border:none; padding:12px; border-radius:30px; font-weight:700; cursor:pointer; margin-top:22px; transition:.2s; font-size:15px;}
.btn:hover{transform:scale(1.02); background:#e6e6e6;}
.footer{text-align:center; margin-top:18px; color:#666; font-size:13px;}
.footer a{color:white; text-decoration:none; font-weight:600;}
.error{background:#ff3b3020; border:1px solid #ff3b3030; color:#ff6b6b; padding:10px; border-radius:10px; font-size:13px; margin-bottom:12px;}
</style>
</head>
<body>

<div class="card">
<div class="logo">FreeSpace</div>
<div class="sub">Bienvenido de vuelta. Entra para continuar.</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">
{% csrf_token %}
<label>Usuario</label>
<input type="text" name="username" placeholder="tu usuario" required>

<label>Contraseña</label>
<div class="input-wrap">
<input type="password" id="password" name="password" placeholder="••••••••" required>
<span class="eye" onclick="verPass()">👁️</span>
</div>

<button type="submit" class="btn">Entrar</button>
</form>

<div class="footer">
¿No tienes cuenta? <a href="/registro/">Regístrate</a>
</div>
</div>

<script>
function verPass(){
  const input = document.getElementById('password');
  const eye = document.querySelector('.eye');
  if(input.type === 'password'){
    input.type = 'text';
    eye.textContent = '🙈';
  } else {
    input.type = 'password';
    eye.textContent = '👁️';
  }
}
</script>

</body>
</html>
