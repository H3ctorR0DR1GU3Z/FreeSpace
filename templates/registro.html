{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta - FreeSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">FreeSpace</h1>
        <h2 class="text-lg font-semibold mb-4 text-center">Crear cuenta</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-100 text-red-700 p-2 rounded mb-3 text-sm">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Usuario" required class="w-full p-3 border rounded-lg">
            <input type="email" name="email" placeholder="Correo" required class="w-full p-3 border rounded-lg">
            <input type="password" name="password" placeholder="Contraseña" required class="w-full p-3 border rounded-lg">
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">Registrarse</button>
        </form>

        <p class="text-center mt-4 text-sm">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-blue-600 font-semibold">Inicia sesión</a></p>
    </div>
</body>
</html>
