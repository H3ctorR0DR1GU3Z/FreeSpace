{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - FreeSpace</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Crear cuenta</h1>

            <p>Únete a FreeSpace.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="username"
                    placeholder="Nombre de usuario"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Contraseña"
                    required
                >

                <input
                    type="password"
                    name="password2"
                    placeholder="Repite la contraseña"
                    required
                >

                <button type="submit">
                    Crear cuenta
                </button>

            </form>

            <p>
                ¿Ya tienes una cuenta?
                <a href="{% url 'login' %}">
                    Iniciar sesión
                </a>
            </p>

            <a href="{% url 'home' %}">
                Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
